# بناء صفحة هبوط جودي ستور ونشرها بمجلد joudi/ (GitHub Pages: /online-job/joudi/)
name: Build & deploy Joudi landing

on:
  push:
    branches: [main]
    paths: ["joudi-landing/**", ".github/workflows/deploy-joudi.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: joudi-landing/package-lock.json

      - name: Install & build
        working-directory: joudi-landing
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Replace published files
        run: |
          rm -rf joudi
          cp -r joudi-landing/dist joudi

      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A joudi
          if git diff --cached --quiet; then
            echo "ما في تغيير"
          else
            git commit -m "Deploy Joudi landing from ${GITHUB_SHA::7}"
            git pull --rebase origin main
            git push
          fi
