# بناء الموقع ونشره تلقائياً
# أي تعديل على مجلد source/ بفرع main بينبني، والملفات الجاهزة بتنحط بجذر الريبو (اللي GitHub Pages بيعرضه).
name: Build & deploy site

on:
  push:
    branches: [main]
    paths: ["source/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install & build
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Replace published files with the new build
        run: |
          rm -rf assets index.html favicon.svg logo.svg logo-192.png logo-512.png og.jpg apple-touch-icon.png
          cp -r source/dist/. .
          touch .nojekyll

      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!source'
          if git diff --cached --quiet; then
            echo "ما في تغيير بالملفات المبنية"
          else
            git commit -m "Deploy build from ${GITHUB_SHA::7}"
            git push
          fi
